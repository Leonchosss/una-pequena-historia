<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 220 320">

<defs>

<linearGradient id="stem"
x1="0%" y1="0%"
x2="0%" y2="100%">

<stop offset="0%" stop-color="#5BAF69"/>
<stop offset="100%" stop-color="#2F7C39"/>

</linearGradient>

<linearGradient id="leaf"
x1="0%" y1="0%"
x2="100%" y2="100%">

<stop offset="0%" stop-color="#7EDB8D"/>
<stop offset="100%" stop-color="#379C4B"/>

</linearGradient>

<radialGradient id="petal">

<stop offset="0%" stop-color="#FFD5E3"/>
<stop offset="45%" stop-color="#FF82AE"/>
<stop offset="100%" stop-color="#C91C5A"/>

</radialGradient>

<radialGradient id="center">

<stop offset="0%" stop-color="#FFADC8"/>
<stop offset="100%" stop-color="#A10F44"/>

</radialGradient>

</defs>

<!-- tallo -->

<path

d="
M110 95
C114 145
108 220
111 290"

fill="none"
stroke="url(#stem)"
stroke-width="7"
stroke-linecap="round"/>

<!-- hoja -->

<path

d="
M108 178
C72 165
63 206
102 214
"

fill="url(#leaf)"/>

<path

d="
M111 208
C153 192
159 234
118 244
"

fill="url(#leaf)"/>

<!-- nervaduras -->

<path
d="M90 178 L103 206"
stroke="#2F7C39"
stroke-width="1.3"
fill="none"/>

<path
d="M126 209 L114 239"
stroke="#2F7C39"
stroke-width="1.3"
fill="none"/>

<!-- pétalos exteriores -->

<ellipse
cx="110"
cy="58"
rx="24"
ry="46"
fill="url(#petal)"/>

<ellipse
cx="82"
cy="70"
rx="23"
ry="38"
transform="rotate(-28 82 70)"
fill="url(#petal)"/>

<ellipse
cx="138"
cy="70"
rx="23"
ry="38"
transform="rotate(28 138 70)"
fill="url(#petal)"/>

<!-- pétalos medios -->

<ellipse
cx="95"
cy="45"
rx="18"
ry="32"
transform="rotate(-18 95 45)"
fill="#FF95BA"/>

<ellipse
cx="125"
cy="45"
rx="18"
ry="32"
transform="rotate(18 125 45)"
fill="#FF95BA"/>

<!-- centro -->

<ellipse
cx="110"
cy="66"
rx="16"
ry="22"
fill="url(#center)"/>

</svg>